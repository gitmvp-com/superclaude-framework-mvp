[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "superclaude-mvp"
version = "1.0.0"
authors = [
    {name = "SuperClaude MVP", email = "mvp@example.com"}
]
description = "MVP version of SuperClaude Framework - A simple CLI tool for development assistance"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.8"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9", 
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Environment :: Console",
]
keywords = ["cli", "development", "tools", "ai", "assistant"]

# Using exact same dependency versions as parent project
dependencies = [
    "setuptools>=45.0.0",
    "typer>=0.9.0",
    "rich>=13.0.0",
    "click>=8.0.0",
    "pyyaml>=6.0.0"
]

[project.urls]
Homepage = "https://github.com/gitmvp-com/superclaude-framework-mvp"
"Original Project" = "https://github.com/SuperClaude-Org/SuperClaude_Framework"

[project.scripts]
superclaude-mvp = "superclaude_mvp.cli:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["superclaude_mvp*"]
exclude = ["tests*", "*.tests*", "*.tests"]
